# Docker Compose for fastify_drizzle_todolist
# 後端 + 資料庫以 Docker 啟動（dev 容器，tsx watch 熱更新）；前端本機 vite dev 連 localhost:7529

name: fastify_drizzle_todolist

services:
  server:
    image: node:22
    container_name: fastify_drizzle_todolist-server
    working_dir: /app
    # 啟動流程：啟用 pnpm → 安裝依賴 → db:push 建表 → db:seed 建立固定測試帳號 → tsx watch 啟動
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@10.17.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm db:push &&
      pnpm db:seed &&
      pnpm --filter server dev"
    environment:
      NODE_ENV: development
      # 後端也用冷門埠（容器內 server 監聽 7529，非常見的 3000）
      PORT: 7529
      # 密碼與密鑰由根目錄 .env 提供（不進版控）
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/fastify_drizzle_todolist
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      # 本機開發用固定測試帳密，未在根目錄 .env 提供時交給 packages/env 的預設值處理
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    ports:
      # host 7529 → 容器 7529（冷門埠；前端本機連 localhost:7529）
      - "7529:7529"
    volumes:
      - .:/app
      # 以匿名 volume 遮蔽 host 的 node_modules，容器內用自身 linux 依賴
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/env/node_modules
      - /app/packages/config/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fastify_drizzle_todolist-network

  worker:
    image: node:22
    container_name: fastify_drizzle_todolist-worker
    working_dir: /app
    # 獨立 outbox worker 程序：與 server 共用 image/依賴，command 最後改跑 worker（輪詢 sweeper）
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@10.17.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter server worker"
    environment:
      NODE_ENV: development
      # worker 不對外提供 HTTP，PORT 沿用預設即可，不映射埠
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/fastify_drizzle_todolist
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      # 送出目標須走 compose network 的服務名 server：容器內 localhost 指向 worker 自己，不是 server
      OUTBOX_WEBHOOK_URL: http://server:7529/mock-external/notifications
    volumes:
      - .:/app
      # 以匿名 volume 遮蔽 host 的 node_modules，容器內用自身 linux 依賴
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/db/node_modules
      - /app/packages/env/node_modules
      - /app/packages/config/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fastify_drizzle_todolist-network

  db:
    image: postgres:16-alpine
    container_name: fastify_drizzle_todolist-postgres
    environment:
      POSTGRES_DB: fastify_drizzle_todolist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fastify_drizzle_todolist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fastify_drizzle_todolist-network

networks:
  fastify_drizzle_todolist-network:
    driver: bridge

volumes:
  fastify_drizzle_todolist_postgres_data:
