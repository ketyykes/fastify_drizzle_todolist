name: fastify_drizzle_todolist

services:
  postgres:
    image: postgres
    container_name: fastify_drizzle_todolist-postgres
    environment:
      POSTGRES_DB: fastify_drizzle_todolist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - fastify_drizzle_todolist_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fastify_drizzle_todolist_postgres_data:
